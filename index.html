<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Calculator</title>
    <meta name="description" content="Calculate and track your attendance requirements easily with our smart PWA calculator.">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6750A4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Attendance Calculator">
    
    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="./icons/favicon.ico">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
    
    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Styles -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Theme Toggle -->
    <div id="theme-toggle-container">
        <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>

    <!-- Install Banner -->
    <div id="install-banner" class="install-banner hidden">
        <div class="install-banner-content">
            <div class="install-banner-text">
                <strong>Install App</strong>
                <span>Get the full experience with our PWA</span>
            </div>
            <div class="install-banner-actions">
                <button id="install-banner-btn" class="install-btn-small">Install</button>
                <button id="install-banner-close" class="close-btn" aria-label="Close install banner">×</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <h1>Smart Attendance Calculator</h1>
        <p class="subtitle">Calculate your attendance requirements smartly</p>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Input Section -->
        <div class="inputs-section">
            <div class="input-group">
                <label for="total-classes">Total Classes Conducted</label>
                <input type="number" id="total-classes" placeholder="e.g., 50" min="1" required>
            </div>

            <div class="input-group">
                <label for="missed-classes">Classes Missed</label>
                <input type="number" id="missed-classes" placeholder="e.g., 5" min="0" required>
            </div>

            <div class="input-group">
                <label for="extra-classes">Extra Classes Attended</label>
                <input type="number" id="extra-classes" placeholder="e.g., 2" min="0">
                
                <div class="switch-container">
                    <span>Count extra in total</span>
                    <label class="switch">
                        <input type="checkbox" id="extra-classes-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="tooltip">
                    <strong>Toggle ON:</strong> Extra classes reduce the total requirement<br>
                    <strong>Toggle OFF:</strong> Extra classes add to your attendance count
                </div>
            </div>

            <div class="input-group">
                <label for="threshold">Required Attendance (%)</label>
                <input type="number" id="threshold" placeholder="e.g., 75" min="1" max="100" step="0.1" required>
            </div>
        </div>

        <!-- Action Button -->
        <button id="calculate-btn" class="primary-btn">
            <span class="btn-text">Calculate Attendance</span>
            <span class="btn-loader hidden">Calculating...</span>
        </button>

        <!-- Results Section -->
        <div id="result" class="result-container hidden">
            <div class="result-header">
                <h3>Your Attendance Status</h3>
            </div>
            <div id="result-content" class="result-content">
                <!-- Dynamic content will be inserted here -->
            </div>
        </div>

        <!-- Install Section -->
        <div id="install-section" class="install-section">
            <button id="install-btn" class="secondary-btn">
                📱 Install as App
            </button>
        </div>
    </main>

    <!-- Scripts -->
    <script src="./script.js"></script>
</body>
</html>
